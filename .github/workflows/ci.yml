name: Aerofusion CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-check:
    name: Rust Core & FFI (Clippy, Test, Bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit & Integration Tests
        run: cargo test --workspace --verbose

      - name: Benchmark Latency Check
        run: cargo bench -p aerofusion-core

  cpp-integration:
    name: C++20 Autopilot Harness Build & Test
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Rust cdylib
        run: cargo build --release --workspace

      - name: Install Clang & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Configure CMake
        run: |
          cmake -B cpp_demo/build -S cpp_demo -DCMAKE_CXX_COMPILER=clang++

      - name: Build C++ Flight Demo
        run: cmake --build cpp_demo/build

      - name: Run C++ Demo
        run: |
          export LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH
          ./cpp_demo/build/aerofusion_demo

  python-sim-verification:
    name: Python Flight Verification & RMSE Check
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Rust cdylib
        run: cargo build --release --workspace

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run End-to-End Flight Accuracy Benchmark
        run: |
          export LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH
          python -m python.aerofusion_sim.run_verification
